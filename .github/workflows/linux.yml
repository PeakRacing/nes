
name: linux
run-name: Linux Build

on:
  push:
    branches: [ "master" ]
    paths-ignore:
        - '.github/workflows/release.yml'
        - 'docs/**'
        - 'README.md'
        - 'README_zh.md'
  pull_request:
    branches: [ "master" ]

jobs:
  build:
    strategy:
        matrix:
          os: [ubuntu-latest]
          arch: [x86_64]
    runs-on: ${{ matrix.os }}
    concurrency:
        group: ${{ matrix.os }}-${{ matrix.arch }}
        cancel-in-progress: true
    steps:
      - uses: actions/checkout@v4
      - name: prepare software
        run: |
          # SDL2 comes from apt only; xmake itself is installed by the official action below,
          # because the "ppa:xmake-io/xmake" repository has no release file for the current
          # ubuntu-latest image and made "apt-get update" fail the whole job.
          sudo apt-get update -y
          sudo apt-get install -y git make gcc p7zip-full libsdl2-dev
      - name: prepare xmake
        uses: xmake-io/github-action-setup-xmake@v1
        with:
          xmake-version: latest
      - name: build sdl2-nes
        run: |
          xrepo update-repo
          cd ./sdl/sdl2
          xmake -v -y
          cp build/linux/${{ matrix.arch }}/release/nes ../../nes-linux-${{ matrix.arch }}.bin
          cd ../../
      - name: build sdl3-nes
        run: |
          xrepo update-repo
          cd ./sdl/sdl3
          xmake -v -y
          # cp build/linux/${{ matrix.arch }}/release/nes ../../nes-linux-${{ matrix.arch }}.bin
          cd ../../
      - name: build and run tests
        run: |
          cd ./test
          xmake -v -y
          ./out/bin/nes-tests
          ./out/bin/nes-tests-stream

      - uses: actions/upload-artifact@v4
        with:
          name: nes-linux-${{ matrix.arch }}.bin
          path: nes-linux-${{ matrix.arch }}.bin
